<h2>{{title}}</h2>
<table mat-table [dataSource]="songs ?? []">
    <ng-container matColumnDef="artist">
        <th mat-header-cell *matHeaderCellDef>Artist</th>
        <td mat-cell *matCellDef="let choice">{{choice.ArtistName}}</td>
    </ng-container>

    <ng-container matColumnDef="song">
        <th mat-header-cell *matHeaderCellDef>Song</th>
        <td mat-cell *matCellDef="let choice">{{choice.TrackName}}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
